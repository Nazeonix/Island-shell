# --- Shell & Font ---
shell                  fish
font_family            JetBrains Mono Nerd Font
font_size              14.0
adjust_line_height     0
adjust_column_width    0
box_drawing_scale      0.001, 1, 1.5, 2

# --- Window Padding & DPI ---
window_padding_width   25
placement_strategy     center
# Kitty handles DPI scaling automatically, but you can force 1:1 pixel mapping:
pixel_edges            yes

# --- Performance & Rendering ---
# Kitty uses standard blending, bold text doesn't automatically force bright colors
text_composition_strategy legacy

# --- Scrollback ---
scrollback_lines       10000

# --- Cursor ---
cursor_shape           beam
cursor_beam_thickness  1.5

# --- Colors & Transparency ---
background_opacity     1
dynamic_background_opacity yes

# --- Key Bindings ---
clear_all_shortcuts    no

# Scrollback
map page_up            scroll_page_up
map page_down          scroll_page_down

# Search (Kitty uses an external pager like 'less' or 'fzf' for scrollback search)
map ctrl+shift+f       show_scrollback

# Primary Colors
#foreground            #99d1ce
#background            #0c1014

# Cursor Colors
#cursor                #99d1ce
#cursor_text_color     #11151c

# Selection Colors
#selection_foreground  #99d1ce
#selection_background  #0a3749

# The 16 Terminal Colors

# Normal
#color0  #0c1014
#color1  #c23127
#color2  #2aa889
#color3  #edb443
#color4  #195466
#color5  #4e5166
#color6  #33859e
#color7  #99d1ce

# Bright
#color8  #0c1014
#color9  #c23127
#color10 #2aa889
#color11 #edb443
#color12 #195466
#color13 #4e5166
#color14 #33859e
#color15 #99d1ce
# Storm
# background #24283b
# cursor_text_color #24283b
# active_tab_background   #1f2335
# inactive_tab_background #1f2335
# macos_titlebar_color #1f2335
# include kitty-colors.conf
# Colors come from the shell: rewritten on every theme change (dynamic-island)
include dynamic-island-theme.conf
